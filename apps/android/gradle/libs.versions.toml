# Pinned toolchain for the Lockd In Android app. Same Gradle/AGP/Kotlin as the
# probes. Change versions together, rebuild in CI, note it in HANDOFF.md.
#   Gradle 8.14.3 (wrapper) · JDK 17 · AGP 8.13.0 · Kotlin 2.2.20 · compileSdk/targetSdk 36 · minSdk 29
[versions]
agp = "8.13.0"
kotlin = "2.2.20"
# Compose 1.12+ (BOM 2026.x) needs AGP 9.1 + compileSdk 37; upgrading the toolchain is tracked separately.
composeBom = "2025.08.00"
activityCompose = "1.10.1"
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"
junit = "4.13.2"
orgJson = "20240303"
# Geofencing for location routines (roadmap step 7, E).
playServicesLocation = "21.3.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
