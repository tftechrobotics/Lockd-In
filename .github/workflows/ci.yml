# Builds and tests everything, and publishes downloadable probe packages
# (Actions run page -> Artifacts). Smoke-test downloads and VM-only policy
# experiments are SEPARATE artifacts so the policy scripts can't be confused
# with the everyday-PC smoke test.
#
# Toolchains are pinned: Rust via rust-toolchain.toml, .NET via
# probes/windows/global.json, Android via the Gradle wrapper and
# probes/android/gradle/libs.versions.toml.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core (Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows-probe:
    name: Windows probe (${{ matrix.rid }})
    runs-on: windows-2025
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: probes/windows/global.json
      - name: Publish self-contained single-file executables
        shell: pwsh
        run: |
          $out = "out/lockdin-probe-windows-${{ matrix.rid }}"
          foreach ($p in 'Probe', 'Target') {
            dotnet publish probes/windows/$p -c Release -r ${{ matrix.rid }} --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $out
          }
          Copy-Item probes/windows/TESTER.md $out/
          Get-ChildItem $out -Filter *.pdb | Remove-Item
      - uses: actions/upload-artifact@v4
        with:
          name: lockdin-probe-windows-${{ matrix.rid }}
          path: out/lockdin-probe-windows-${{ matrix.rid }}
          retention-days: 30
      # Mechanical check only: the runner is a headless service session, so this
      # proves the probe starts, launches its guardian, releases on time and
      # exits cleanly. It is NOT evidence that restriction works on a desktop.
      # Runs after the upload so a failure here never blocks the download.
      # Diagnostics are emitted as annotations (readable via the API).
      - name: Runner sanity run (x64 only)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $out = "out/lockdin-probe-windows-win-x64"
          $logs = Join-Path $env:LOCALAPPDATA 'LockdInProbe'
          function Report($msg) {
            $files = Get-ChildItem $logs -Filter '*.jsonl' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 4
            $text = ($files | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 15 }) -join "%0A"
            Write-Host "::error title=Sanity run::$msg%0A$text"
            exit 1
          }
          $t = Start-Process "$out/LockdInTarget.exe" -ArgumentList '--silent' -PassThru
          $p = Start-Process "$out/LockdInProbe.exe" -ArgumentList '--block','LockdInTarget.exe','--minutes','0.5' -PassThru -Wait -NoNewWindow -RedirectStandardOutput probe-out.txt -RedirectStandardError probe-err.txt
          if (-not $t.HasExited) { Stop-Process -Id $t.Id -Force }
          $stdout = ((Get-Content probe-out.txt, probe-err.txt -ErrorAction SilentlyContinue) -join "%0A")
          if ($p.ExitCode -ne 0) { Report "probe exit code $($p.ExitCode)%0A$stdout" }
          $probeLog = Get-ChildItem $logs -Filter 'probe-*.jsonl' | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $probeLog) { Report "no probe log written%0A$stdout" }
          if (-not (Select-String -Path $probeLog.FullName -SimpleMatch '"evt":"released"' -Quiet)) { Report 'probe did not log a release' }
          if (-not (Select-String -Path $probeLog.FullName -SimpleMatch '"evt":"guardian_started","data":{"ok":true}' -Quiet)) { Report 'guardian did not start' }
          & "$out/LockdInProbe.exe" --recover
          if ($LASTEXITCODE -ne 0) { Report '--recover failed' }
          Write-Host "Sanity run passed."

  vm-experiments:
    name: VM-only policy experiments (separate download)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: probes/windows/global.json
      - name: Lint and parse scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path probes/windows-vm -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions
          $r | Format-Table -AutoSize | Out-String | Write-Host
          if ($r) { throw "PSScriptAnalyzer findings: $(@($r).Count)" }
      - name: Package (scripts + harmless x64 target only)
        shell: pwsh
        run: |
          $out = 'out/lockdin-vm-policy-experiments-DISPOSABLE-VM-ONLY'
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item probes/windows-vm/* $out/
          dotnet publish probes/windows/Target -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $out
          Get-ChildItem $out -Filter *.pdb | Remove-Item
      - uses: actions/upload-artifact@v4
        with:
          name: lockdin-vm-policy-experiments-DISPOSABLE-VM-ONLY
          path: out/lockdin-vm-policy-experiments-DISPOSABLE-VM-ONLY
          retention-days: 30

  android-probe:
    name: Android probe
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: probes/android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs (probe + harmless target)
        run: ./gradlew --no-daemon :probe:assembleDebug :target:assembleDebug
      - name: Collect
        run: |
          mkdir -p ../../out/lockdin-probe-android
          cp probe/build/outputs/apk/debug/probe-debug.apk ../../out/lockdin-probe-android/lockdin-probe.apk
          cp target/build/outputs/apk/debug/target-debug.apk ../../out/lockdin-probe-android/lockdin-probe-target.apk
          cp TESTER.md ../../out/lockdin-probe-android/
      - uses: actions/upload-artifact@v4
        with:
          name: lockdin-probe-android
          path: out/lockdin-probe-android
          retention-days: 30

  # Release-signed bundles for Google Play internal testing (owner decision R18:
  # devices get builds only through trusted channels). Skips cleanly until the
  # owner adds the two upload-key secrets. The key never leaves the runner's
  # temp directory and is deleted at the end of the job.
  android-play-bundles:
    name: Android Play bundles (internal testing)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: probes/android
    env:
      HAS_UPLOAD_KEY: ${{ secrets.LOCKDIN_UPLOAD_KEYSTORE_B64 != '' && secrets.LOCKDIN_UPLOAD_STORE_PASSWORD != '' }}
    steps:
      - name: Upload key not configured
        if: env.HAS_UPLOAD_KEY != 'true'
        working-directory: .
        run: echo "::notice::Play upload-key secrets are not set; skipping signed bundles."
      - uses: actions/checkout@v4
        if: env.HAS_UPLOAD_KEY == 'true'
      - uses: gradle/actions/wrapper-validation@v4
        if: env.HAS_UPLOAD_KEY == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_UPLOAD_KEY == 'true'
      - name: Build signed release bundles (probe + harmless target)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.LOCKDIN_UPLOAD_KEYSTORE_B64 }}
          LOCKDIN_UPLOAD_STORE_PASSWORD: ${{ secrets.LOCKDIN_UPLOAD_STORE_PASSWORD }}
          LOCKDIN_UPLOAD_KEY_PASSWORD: ${{ secrets.LOCKDIN_UPLOAD_STORE_PASSWORD }}
          LOCKDIN_UPLOAD_KEY_ALIAS: lockdin-probe-upload
          LOCKDIN_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/upload.p12"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$key"
          export LOCKDIN_UPLOAD_STORE_FILE="$key"
          ./gradlew --no-daemon :probe:bundleRelease :target:bundleRelease
      - name: Collect
        if: env.HAS_UPLOAD_KEY == 'true'
        run: |
          mkdir -p ../../out/lockdin-play-bundles
          cp probe/build/outputs/bundle/release/probe-release.aab ../../out/lockdin-play-bundles/lockdin-probe.aab
          cp target/build/outputs/bundle/release/target-release.aab ../../out/lockdin-play-bundles/lockdin-probe-target.aab
          echo "versionCode ${{ github.run_number }}" > ../../out/lockdin-play-bundles/VERSION.txt
      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: lockdin-play-bundles
          path: out/lockdin-play-bundles
          retention-days: 30
