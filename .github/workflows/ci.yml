# Builds and tests everything, and publishes downloadable probe packages
# (Actions run page -> Artifacts). Smoke-test downloads and VM-only policy
# experiments are SEPARATE artifacts so the policy scripts can't be confused
# with the everyday-PC smoke test.
#
# Toolchains are pinned: Rust via rust-toolchain.toml, .NET via
# probes/windows/global.json, Android via the Gradle wrapper and
# probes/android/gradle/libs.versions.toml.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core (Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Web parity vectors are current
        run: |
          cargo run -q -p lockdin-core --example parity_vectors > /tmp/vectors.json
          diff -u apps/web/src/engine/parity-vectors.json /tmp/vectors.json

  web:
    name: Web app (unit, build, end-to-end, accessibility)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Design token contrast
        run: node ../../design/check-contrast.mjs
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  windows-probe:
    name: Windows probe (${{ matrix.rid }})
    runs-on: windows-2025
    # id-token lets this job sign in to Azure with GitHub OIDC (no stored
    # password). Used only by the signing steps below.
    permissions:
      contents: read
      id-token: write
    env:
      # Signing runs only on main (the Azure federated credential trusts only
      # refs/heads/main) and only once the owner has set the repository
      # variables in docs/windows-signing.md. Otherwise builds stay unsigned
      # and say so.
      SIGN: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: probes/windows/global.json
      - name: Publish self-contained single-file executables
        shell: pwsh
        run: |
          $out = "out/lockdin-probe-windows-${{ matrix.rid }}"
          foreach ($p in 'Probe', 'Target') {
            dotnet publish probes/windows/$p -c Release -r ${{ matrix.rid }} --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $out
          }
          Copy-Item probes/windows/TESTER.md $out/
          Get-ChildItem $out -Filter *.pdb | Remove-Item
      - name: Azure sign-in (OIDC)
        if: env.SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign with Azure Artifact Signing
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: out/lockdin-probe-windows-${{ matrix.rid }}
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Lockd In probe (test build)
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify signatures and record signing status
        shell: pwsh
        run: |
          $out = "out/lockdin-probe-windows-${{ matrix.rid }}"
          $files = Get-ChildItem $out -Include *.exe, *.dll -Recurse
          $lines = foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '-' }
            "$($f.Name): $($sig.Status) ($subject)"
            if ($env:SIGN -eq 'true' -and $sig.Status -ne 'Valid') {
              Write-Host "::error title=Signing::$($f.Name) signature status $($sig.Status)"; $bad = $true
            }
          }
          $head = if ($env:SIGN -eq 'true') { 'SIGNED with Azure Artifact Signing.' } else { 'UNSIGNED. Smart App Control will block these files; see docs/windows-signing.md.' }
          Set-Content "$out/SIGNING.txt" (@($head, '') + $lines)
          Write-Host "::notice title=Signing (${{ matrix.rid }})::$head $($lines -join '; ')"
          if ($bad) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: lockdin-probe-windows-${{ matrix.rid }}
          path: out/lockdin-probe-windows-${{ matrix.rid }}
          retention-days: 30
      # Mechanical check only: the runner is a headless service session, so this
      # proves the probe starts, launches its guardian, releases on time and
      # exits cleanly. It is NOT evidence that restriction works on a desktop.
      # Runs after the upload so a failure here never blocks the download.
      # Diagnostics are emitted as annotations (readable via the API).
      - name: Runner sanity run (x64 only)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $out = "out/lockdin-probe-windows-win-x64"
          $logs = Join-Path $env:LOCALAPPDATA 'LockdInProbe'
          function Report($msg) {
            $files = Get-ChildItem $logs -Filter '*.jsonl' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 4
            $text = ($files | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 15 }) -join "%0A"
            Write-Host "::error title=Sanity run::$msg%0A$text"
            exit 1
          }
          $t = Start-Process "$out/LockdInTarget.exe" -ArgumentList '--silent' -PassThru
          $p = Start-Process "$out/LockdInProbe.exe" -ArgumentList '--block','LockdInTarget.exe','--minutes','0.5' -PassThru -Wait -NoNewWindow -RedirectStandardOutput probe-out.txt -RedirectStandardError probe-err.txt
          if (-not $t.HasExited) { Stop-Process -Id $t.Id -Force }
          $stdout = ((Get-Content probe-out.txt, probe-err.txt -ErrorAction SilentlyContinue) -join "%0A")
          if ($p.ExitCode -ne 0) { Report "probe exit code $($p.ExitCode)%0A$stdout" }
          $probeLog = Get-ChildItem $logs -Filter 'probe-*.jsonl' | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $probeLog) { Report "no probe log written%0A$stdout" }
          if (-not (Select-String -Path $probeLog.FullName -SimpleMatch '"evt":"released"' -Quiet)) { Report 'probe did not log a release' }
          if (-not (Select-String -Path $probeLog.FullName -SimpleMatch '"evt":"guardian_started","data":{"ok":true}' -Quiet)) { Report 'guardian did not start' }
          & "$out/LockdInProbe.exe" --recover
          if ($LASTEXITCODE -ne 0) { Report '--recover failed' }
          Write-Host "Sanity run passed."

  # The Windows app: native shell + bundled shared interface (ADR-0009).
  # The launch test proves the window starts, WebView2 loads the bundled UI
  # offline and the bridge answers. It does not prove any blocking.
  windows-app:
    name: Windows app (${{ matrix.rid }})
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
    env:
      SIGN: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, platform: x64 }
          - { rid: win-arm64, platform: ARM64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the shared interface
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/windows/global.json
      - name: Bridge contract tests
        if: matrix.rid == 'win-x64'
        run: dotnet run -c Release --project apps/windows/LockdIn.Desktop.Tests
      - name: Publish (self-contained, unpackaged)
        shell: pwsh
        run: |
          dotnet publish apps/windows/LockdIn.Desktop -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -o out/lockdin-windows-${{ matrix.rid }}
          Get-ChildItem out/lockdin-windows-${{ matrix.rid }} -Recurse -Filter *.pdb | Remove-Item
          if (-not (Test-Path out/lockdin-windows-${{ matrix.rid }}/ui/index.html)) { Write-Host "::error::Bundled interface missing"; exit 1 }
          $res = (Get-ChildItem out/lockdin-windows-${{ matrix.rid }} -Recurse -Include *.pri, *.xbf | ForEach-Object { $_.Name }) -join ', '
          Write-Host "::notice title=XAML resources (${{ matrix.rid }})::$res"
      - name: Azure sign-in (OIDC)
        if: env.SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign with Azure Artifact Signing
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: out/lockdin-windows-${{ matrix.rid }}
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Lockd In
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Record signing status
        shell: pwsh
        run: |
          $out = "out/lockdin-windows-${{ matrix.rid }}"
          $sig = Get-AuthenticodeSignature "$out/LockdIn.exe"
          $unsigned = (Get-ChildItem $out -Recurse -Include *.exe, *.dll | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }).Count
          $head = if ($env:SIGN -eq 'true') { "SIGNED. LockdIn.exe: $($sig.Status). Files not validly signed: $unsigned." } else { "UNSIGNED. LockdIn.exe: $($sig.Status). Smart App Control will block it; see docs/windows-signing.md." }
          Set-Content "$out/SIGNING.txt" $head
          Write-Host "::notice title=Windows app signing (${{ matrix.rid }})::$head"
          if ($env:SIGN -eq 'true' -and $sig.Status -ne 'Valid') { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: lockdin-windows-${{ matrix.rid }}
          path: out/lockdin-windows-${{ matrix.rid }}
          retention-days: 30
      - name: Launch test (x64)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $env:LOCKDIN_SMOKE = '1'
          $p = Start-Process "out/lockdin-windows-win-x64/LockdIn.exe" -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; $code = 'timeout' } else { $code = $p.ExitCode }
          $log = Join-Path $env:LOCALAPPDATA 'LockdIn/logs/shell.log'
          $tail = if (Test-Path $log) { (Get-Content $log -Tail 30) -join '%0A' } else { 'no shell.log' }
          Write-Host "::notice title=Windows app launch test::exit=$code%0A$tail"
          if ($code -ne 0) {
            $ev = Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' -and $_.TimeCreated -gt (Get-Date).AddMinutes(-5) } |
              Select-Object -First 3 | ForEach-Object { ($_.Message -replace "`r?`n", ' | ').Substring(0, [Math]::Min(1800, $_.Message.Length)) }
            Write-Host "::error title=Windows app launch test::exit $code%0A$($ev -join '%0A---%0A')"
            exit 1
          }
          if (-not (Select-String -Path $log -SimpleMatch 'ui.ready' -Quiet)) { Write-Host "::error::Interface never reported ready"; exit 1 }

  # SPIKE (risk R6b): does our in-app App Control compiler produce the same
  # binary as Microsoft's ConvertFrom-CIPolicy? Builds files only. Nothing is
  # deployed: no CiTool call exists in the spike or in this job.
  appcontrol-spike:
    name: App Control compiler spike (no deployment)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: probes/windows/global.json
      - name: Build and self-test
        shell: pwsh
        run: |
          dotnet build probes/windows/AppControlSpike -c Release
          dotnet probes/windows/AppControlSpike/bin/Release/net10.0/LockdInAppControlSpike.dll selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Compare with Microsoft's compiler
        shell: pwsh
        run: |
          $dll = 'probes/windows/AppControlSpike/bin/Release/net10.0/LockdInAppControlSpike.dll'
          $out = Join-Path $env:RUNNER_TEMP 'spike'
          dotnet $dll build --deny steam.exe=Steam --deny Discord.exe=Discord --deny LockdInTarget.exe=Target --out $out --policy-id 6d6b2f1e-1c5a-4b8e-9a51-0f3c2d7e9b10
          if (-not (Get-Command ConvertFrom-CIPolicy -ErrorAction SilentlyContinue)) {
            Write-Host "::warning title=App Control spike::ConvertFrom-CIPolicy is not available on this runner; byte comparison skipped."
            exit 0
          }
          $ms = Join-Path $out 'microsoft.cip'
          try {
            ConvertFrom-CIPolicy -XmlFilePath (Join-Path $out 'policy.xml') -BinaryFilePath $ms | Out-Null
          } catch {
            Write-Host "::error title=App Control spike::Microsoft's compiler rejected our XML: $($_.Exception.Message)"
            exit 1
          }
          $ours = [IO.File]::ReadAllBytes((Join-Path $out 'lockdin.cip'))
          $theirs = [IO.File]::ReadAllBytes($ms)
          $same = [Linq.Enumerable]::SequenceEqual($ours, $theirs)
          $first = -1
          if (-not $same) { for ($i = 0; $i -lt [Math]::Min($ours.Length, $theirs.Length); $i++) { if ($ours[$i] -ne $theirs[$i]) { $first = $i; break } } }
          $a = dotnet $dll describe (Join-Path $out 'lockdin.cip')
          $b = dotnet $dll describe $ms
          Write-Host "::notice title=App Control spike (bytes)::identical=$same; ours=$($ours.Length) B; microsoft=$($theirs.Length) B; first difference at byte $first"
          Write-Host "::notice title=App Control spike (ours)::$a"
          Write-Host "::notice title=App Control spike (microsoft)::$b"
          if (-not $same -and $a -ne $b) { Write-Host "::error title=App Control spike::Binaries differ in content, not just encoding"; exit 1 }
          if (-not $same) { Write-Host "::warning title=App Control spike::Bytes differ but parsed content is identical" }

  vm-experiments:
    name: VM-only policy experiments (separate download)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: probes/windows/global.json
      - name: Lint and parse scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path probes/windows-vm -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions
          $r | Format-Table -AutoSize | Out-String | Write-Host
          if ($r) { throw "PSScriptAnalyzer findings: $(@($r).Count)" }
      - name: Package (scripts + harmless x64 target only)
        shell: pwsh
        run: |
          $out = 'out/lockdin-vm-policy-experiments-DISPOSABLE-VM-ONLY'
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item probes/windows-vm/* $out/
          dotnet publish probes/windows/Target -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $out
          Get-ChildItem $out -Filter *.pdb | Remove-Item
      - uses: actions/upload-artifact@v4
        with:
          name: lockdin-vm-policy-experiments-DISPOSABLE-VM-ONLY
          path: out/lockdin-vm-policy-experiments-DISPOSABLE-VM-ONLY
          retention-days: 30

  android-probe:
    name: Android probe
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: probes/android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs (probe + harmless target)
        run: ./gradlew --no-daemon :probe:assembleDebug :target:assembleDebug
      - name: Collect
        run: |
          mkdir -p ../../out/lockdin-probe-android
          cp probe/build/outputs/apk/debug/probe-debug.apk ../../out/lockdin-probe-android/lockdin-probe.apk
          cp target/build/outputs/apk/debug/target-debug.apk ../../out/lockdin-probe-android/lockdin-probe-target.apk
          cp TESTER.md ../../out/lockdin-probe-android/
      - uses: actions/upload-artifact@v4
        with:
          name: lockdin-probe-android
          path: out/lockdin-probe-android
          retention-days: 30

  # Release-signed bundles for Google Play internal testing (owner decision R18:
  # devices get builds only through trusted channels). Skips cleanly until the
  # owner adds the two upload-key secrets. The key never leaves the runner's
  # temp directory and is deleted at the end of the job.
  android-play-bundles:
    name: Android Play bundles (internal testing)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: probes/android
    env:
      HAS_UPLOAD_KEY: ${{ secrets.LOCKDIN_UPLOAD_KEYSTORE_B64 != '' && secrets.LOCKDIN_UPLOAD_STORE_PASSWORD != '' }}
    steps:
      - name: Upload key not configured
        if: env.HAS_UPLOAD_KEY != 'true'
        working-directory: .
        run: echo "::notice::Play upload-key secrets are not set; skipping signed bundles."
      - uses: actions/checkout@v4
        if: env.HAS_UPLOAD_KEY == 'true'
      - uses: gradle/actions/wrapper-validation@v4
        if: env.HAS_UPLOAD_KEY == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_UPLOAD_KEY == 'true'
      - name: Build signed release bundles (probe + harmless target)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.LOCKDIN_UPLOAD_KEYSTORE_B64 }}
          LOCKDIN_UPLOAD_STORE_PASSWORD: ${{ secrets.LOCKDIN_UPLOAD_STORE_PASSWORD }}
          LOCKDIN_UPLOAD_KEY_PASSWORD: ${{ secrets.LOCKDIN_UPLOAD_STORE_PASSWORD }}
          LOCKDIN_UPLOAD_KEY_ALIAS: lockdin-probe-upload
          LOCKDIN_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/upload.p12"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$key"
          export LOCKDIN_UPLOAD_STORE_FILE="$key"
          ./gradlew --no-daemon :probe:bundleRelease :target:bundleRelease
      - name: Collect
        if: env.HAS_UPLOAD_KEY == 'true'
        run: |
          mkdir -p ../../out/lockdin-play-bundles
          cp probe/build/outputs/bundle/release/probe-release.aab ../../out/lockdin-play-bundles/lockdin-probe.aab
          cp target/build/outputs/bundle/release/target-release.aab ../../out/lockdin-play-bundles/lockdin-probe-target.aab
          echo "versionCode ${{ github.run_number }}" > ../../out/lockdin-play-bundles/VERSION.txt
      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: lockdin-play-bundles
          path: out/lockdin-play-bundles
          retention-days: 30
