# Checks that the Cloudflare deploy secrets work (R49). Prints only yes/no results, never the
# token or the account ID.
name: Service credentials check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Cloudflare token and account
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          [ -n "$CF_TOKEN" ] && echo "token secret: present" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          [ -n "$CF_ACCOUNT" ] && echo "account secret: present" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          v=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.success and (.result.status == "active")')
          echo "token valid and active: $v"
          a=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts" | jq -r '.success')
          echo "can read Workers in this account: $a"
          d=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database" | jq -r '.success')
          echo "can read D1 databases in this account: $d"
          [ "$v" = true ] && [ "$a" = true ] && [ "$d" = true ] || { echo "::error::One of the checks failed (see above)"; exit 1; }
          echo "::notice::Cloudflare token and account work for Workers and D1."
