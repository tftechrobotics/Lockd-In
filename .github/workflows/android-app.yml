# Lockd In Android app: build, unit tests (incl. Rust parity vectors), lint,
# then UI tests on an emulator. Screenshots from the UI tests are pushed to the
# `ci-screenshots` branch for design review. Emulator results are not evidence
# about any physical phone.
name: Android app
on:
  push:
    branches: [main]
    paths: ["apps/android/**", "apps/web/src/engine/parity-vectors.json", "design/**", ".github/workflows/android-app.yml"]
  pull_request:
    paths: ["apps/android/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    name: Build, unit tests, lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug 2>&1 | tee ../../build.log
      - name: Report failures
        if: failure()
        working-directory: .
        run: |
          grep -E '^e: |error:|Lint found' build.log | head -30 | while IFS= read -r line; do echo "::error title=Build::${line:0:900}"; done
          what=$(grep -A25 'What went wrong' build.log | head -40 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')
          [ -n "$what" ] && echo "::error title=Gradle::${what:0:3500}"
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("apps/android/app/build/test-results/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for fail in list(tc.findall("failure")) + list(tc.findall("error")):
                      msg = (fail.get("message") or fail.text or "")[:600].replace("\n", "%0A")
                      print(f"::error title=Unit test {tc.get('name')}::{msg}")
          PY
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # artifact storage quota must not fail the build
        with:
          name: lockdin-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ui:
    name: UI tests on emulator (API 35)
    needs: app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # push screenshots to the ci-screenshots branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI tests
        id: tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: apps/android
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch ../../ui-tests-failed
            mkdir -p ../../out/screens && adb exec-out run-as app.lockdin tar c -C files screens > ../../out/screens.tar || true
      - name: Report UI test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          total = failed = 0
          for f in glob.glob("apps/android/app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  total += 1
                  for fail in list(tc.findall("failure")) + list(tc.findall("error")):
                      failed += 1
                      msg = (fail.text or fail.get("message") or "")[:900].replace("\n", "%0A")
                      print(f"::error title=UI test {tc.get('name')}::{msg}")
          print(f"::notice title=Android UI tests (EMULATOR ONLY)::{total - failed}/{total} passed")
          PY
          if [ -f ui-tests-failed ]; then exit 1; fi
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        run: |
          set -e
          [ -s out/screens.tar ] || { echo "::warning::No screenshots captured"; exit 0; }
          mkdir -p shots && tar -xf out/screens.tar -C shots
          sha=$(git rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-screenshots || true
          if git rev-parse --verify origin/ci-screenshots >/dev/null 2>&1; then
            git worktree add ../shots-branch origin/ci-screenshots -B ci-screenshots
          else
            git worktree add --orphan -b ci-screenshots ../shots-branch
          fi
          rm -rf ../shots-branch/android && mkdir -p ../shots-branch/android
          cp shots/screens/*.png ../shots-branch/android/
          echo "Screenshots from commit $sha (emulator, API 35, Pixel 6 profile)." > ../shots-branch/android/README.txt
          cd ../shots-branch && git add -A && git commit -qm "Android screenshots for $sha" && git push -q origin ci-screenshots
          echo "::notice title=Screenshots::$(ls android | tr '\n' ' ')"
